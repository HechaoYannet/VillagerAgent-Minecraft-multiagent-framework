# ===========================================
# VillagerAgent 敏感配置模板
# 复制此文件为 secrets.yaml 并填入真实值
# secrets.yaml 已加入 .gitignore
# ===========================================

# LLM API 密钥
llm:
  api_key: "sk-your-api-key-here"
  # 备用密钥 (可选)
  api_key_fallback: ""

# Web 管理后台
web:
  password: "change-me-to-a-strong-password"
  # JWT 密钥 (使用 python -c "import secrets; print(secrets.token_hex(32))" 生成)
  jwt_secret: "change-me-to-a-random-secret"

# Google Gemini (如果需要)
gemini:
  api_key: ""

# Minecraft EasyAuth 自动登录
# 如果 Minecraft 服务器安装了 EasyAuth 模组，设置此密码以自动登录
easyauth:
  password: ""
  force_login: false  # true: 始终用 /login (globalPassword 模式); false: 自动检测 /login 或 /register

# 告警 (可选)
alerts:
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  alert_email: ""
