# =============================================
# VillagerAgent Docker Compose 配置
# =============================================
# 用法:
#   1. 复制 config/secrets.template.yaml 为 config/secrets.yaml 并填入真实值
#   2. 设置环境变量 (或创建 .env 文件):
#        MINECRAFT_HOST=你的MC服务器IP
#        LLM_API_KEY=sk-your-api-key
#   3. docker compose -f docker/docker-compose.yml up
# =============================================

version: '3.8'

services:
  # ── 主服务: VillagerAgent 核心 ──
  villager-core:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: villager-agent
    restart: unless-stopped
    volumes:
      # 持久化数据
      - ../data/world:/app/data/world
      - ../logs:/app/logs
      # 配置文件 (只读)
      - ../config:/app/config:ro
    environment:
      # Minecraft 连接
      - MINECRAFT_HOST=${MINECRAFT_HOST:-localhost}
      - MINECRAFT_PORT=${MINECRAFT_PORT:-25565}
      # Bridge 配置
      - BRIDGE_MODE=${BRIDGE_MODE:-real}
      - BRIDGE_PORT=${BRIDGE_PORT:-5000}
      - AGENT_USERNAME=${AGENT_USERNAME:-VillagerAgent}
      # Web 管理后台
      - WEB_PORT=${WEB_PORT:-8080}
      # LLM API (推荐通过环境变量传入, 避免写死在 secrets.yaml)
      - LLM_API_KEY=${LLM_API_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
      # Bridge 端口仅内部使用, 如需外部访问请取消注释:
      # - "${BRIDGE_PORT:-5000}:5000"
    networks:
      - villager-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  villager-net:
    driver: bridge
